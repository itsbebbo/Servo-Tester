; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; This project directory lives on a Google Drive sync mount (G:\), whose
; virtual filesystem driver adds heavy per-file latency to the many small
; stat/timestamp checks SCons does on every build - a no-op incremental
; build here took ~26s vs ~1-2s on local disk. Redirect the build/libdeps
; output (object files, linked firmware, downloaded libraries) to local
; disk; only the source/config stays on Google Drive. Machine-specific,
; like PLATFORMIO_CORE_DIR in CLAUDE.md's Windows toolchain note - adjust
; or remove this section on another machine.
workspace_dir = C:/pio/workspace/m5dial-servo-pwm
build_cache_dir = C:/pio/build_cache

[env:m5dial]
; The official PlatformIO registry's "espressif32" platform is stuck on
; Arduino-ESP32 core 2.0.x (no pin-based ledcAttach()/ledcWrite(), limited
; C++17 support). This project needs Arduino-ESP32 3.x, so it uses the
; actively-maintained pioarduino fork instead.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- M5Dial hardware: ESP32-S3FN8, 8MB flash, no PSRAM ---
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    m5stack/M5GFX @ ^0.2.9
    m5stack/M5Dial @ ^1.0.3
    lvgl/lvgl @ ^8.3.11
